<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Xog-Macallin-Arday</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="user-info">
                <h2><i class="fas fa-user-shield"></i> Admin Dashboard</h2>
                <p id="admin-name">Loading...</p>
            </div>
            <button id="logout-btn" class="btn-logout">Logout</button>
        </div>
        
        <div class="dashboard">
            <div class="card">
                <h3><i class="fas fa-user-plus"></i> Add New Student</h3>
                <div class="input-group">
                    <input type="text" id="student-name" placeholder="Student Name" required>
                </div>
                <div class="input-group">
                    <input type="text" id="student-username" placeholder="Username" required>
                </div>
                <div class="input-group">
                    <input type="password" id="student-password" placeholder="Password" required>
                </div>
                <button id="add-student-btn" class="btn-primary">Add Student</button>
            </div>
            
            <div class="card">
                <h3><i class="fas fa-users"></i> Students List</h3>
                <div class="input-group">
                    <i class="fas fa-search"></i>
                    <input type="text" id="search-student" placeholder="Search student...">
                </div>
                <div id="students-list" class="data-list"></div>
            </div>
        </div>
        
        <div class="footer">
            <p>© 2026 Xog-Macallin-Arday System | <a href="index.html">Home</a></p>
        </div>
    </div>

    <button id="dark-mode-toggle" class="dark-mode-btn">
        <i class="fas fa-moon"></i>
    </button>

    <script src="data.js"></script>
    <script src="admin.js"></script>
</body>
</html>
